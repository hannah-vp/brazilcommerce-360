# Runs automatically on `git commit`. Install once with:
#     pip install pre-commit
#     pre-commit install
#
# The hooks below catch three classes of problem before they ever reach a
# commit: leaked credentials, malformed config files, and inconsistent SQL
# formatting.

repos:

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: detect-private-key        # blocks committing a key file
      - id: check-added-large-files    # blocks committing data dumps
        args: ['--maxkb=5000']
      - id: check-yaml                 # catches malformed dbt YAML early
        args: ['--allow-multiple-documents']
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ['--fix=lf']
